name: bussola
description: "Bússola — assistente inteligente de produtividade e organização pessoal/corporativa."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  go_router: ^14.2.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  flutter_appauth: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
